<script>
const DATA_URL = "./data.json";
const RATE_NORMAL = 30000;
const RATE_LUXURY = 35000;
let appData = null;
let currentFilter = "all";

function fmt(n) {
  if (!n || n === 0) return "—";
  if (n >= 1e9) return (n/1e9).toFixed(1) + " میلیارد";
  if (n >= 1e6) return (n/1e6).toFixed(0) + " میلیون";
  return n.toLocaleString("fa-IR");
}
function fmtShort(n) {
  if (!n || n === 0) return "—";
  if (n >= 1e9) return (n/1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(0) + "M";
  return (n/1000).toFixed(0) + "K";
}
function calcRent(m, lux) {
  if (!m) return 0;
  return Math.round((m/1e6) * (lux ? RATE_LUXURY : RATE_NORMAL));
}

// SVG icons
const icons = {
  house: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 21V12h6v9" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
  office: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="white" stroke-width="1.5"/><path d="M3 9h18M9 9v12M15 9v12" stroke="white" stroke-width="1.5"/></svg>`,
  shop: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16l-1.5 8H5.5L4 7z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 7L3 3H1M8 7V4M12 7V3M16 7V4" stroke="white" stroke-width="1.5" stroke-linecap="round"/><path d="M6 21a1 1 0 100-2 1 1 0 000 2zM18 21a1 1 0 100-2 1 1 0 000 2z" fill="white"/></svg>`,
  land: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 20h20M6 20V10l6-6 6 6v10" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="14" r="2" stroke="white" stroke-width="1.5"/></svg>`,
  old: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="3 2" stroke-linejoin="round"/></svg>`,
  key: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="12" r="4" stroke="white" stroke-width="1.5"/><path d="M12 12h8M18 10v4M20 10v4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  calc: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" stroke="white" stroke-width="1.5"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2M16 16h0" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>`,
};

function iconBox(svg, bg) {
  return `<div class="d-row-icon" style="background:${bg}">${svg}</div>`;
}

async function loadData() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    appData = await res.json();
    render();
  } catch(e) {
    document.getElementById("regions").innerHTML =
      `<div class="loading-wrap"><div class="loading-text">خطا در بارگذاری</div></div>`;
  }
}

function render() {
  document.getElementById("updateDate").textContent = appData.lastUpdate;
  let list = appData.regions;
  if (currentFilter === "luxury") list = list.filter(r => r.luxury);
  document.getElementById("regionCount").textContent = list.length + " منطقه";

  const container = document.getElementById("regions");
  if (list.length === 0) {
    container.innerHTML = `<div class="loading-wrap"><div class="loading-text">منطقه‌ای یافت نشد</div></div>`;
    return;
  }

  let html = `<div class="section-header">مناطق تهران</div>`;
  html += `<div class="d-list" style="border-radius:16px">`;

  list.forEach((r, i) => {
    const ch = r.monthlyChange ?? 0;
    const isUp = ch >= 0;
    const showVal = currentFilter === "rent"
      ? fmtShort(r.rentResidential) + " رهن"
      : fmtShort(r.buyResidential) + " خرید";

    html += `
    <div class="region-card" onclick="openSheet(${r.id})" style="animation-delay:${i*0.04}s">
      <div class="card-inner">
        <div class="card-icon ${r.luxury ? 'luxury' : ''}">
          ${icons.house}
        </div>
        <div class="card-info">
          <div class="card-name">
            ${r.name}
            ${r.luxury ? '<span class="luxury-dot"></span>' : ''}
          </div>
          <div class="card-sub">
            <span>${fmtShort(r.buyResidential)}</span> مسکونی
            · <span>${fmtShort(r.rentResidential)}</span> رهن
          </div>
        </div>
        <div class="card-right">
          <div class="card-price">${fmtShort(r.buyResidential)}</div>
          <div class="card-change ${isUp ? 'up' : 'down'}">
            ${isUp ? '▲' : '▼'} ${Math.abs(ch)}%
          </div>
        </div>
        <div class="chevron">›</div>
      </div>
    </div>`;
  });

  html += `</div>`;
  container.innerHTML = html;
}

function openSheet(id) {
  const r = appData.regions.find(x => x.id === id);
  if (!r) return;
  const ch = r.monthlyChange ?? 0;
  const isUp = ch >= 0;
  const rate = r.luxury ? RATE_LUXURY : RATE_NORMAL;

  document.getElementById("sheetRegion").textContent = r.name;
  document.getElementById("sheetDate").textContent = appData.lastUpdate;
  const badge = document.getElementById("sheetChange");
  badge.textContent = (isUp ? "▲ +" : "▼ ") + ch + "%";
  badge.className = "sheet-badge " + (isUp ? "up" : "down");

  const buyRows = [
    { label: "مسکونی", val: r.buyResidential, icon: icons.house, bg: "rgba(201,168,76,0.12)" },
    { label: "اداری",  val: r.buyOffice,       icon: icons.office, bg: "rgba(255,255,255,0.06)" },
    { label: "تجاری",  val: r.buyCommercial,   icon: icons.shop,  bg: "rgba(255,255,255,0.06)" },
    { label: "زمین",   val: r.buyLand,         icon: icons.land,  bg: "rgba(255,255,255,0.06)" },
    { label: "کلنگی",  val: r.buyOld,          icon: icons.old,   bg: "rgba(255,255,255,0.04)" },
  ];

  const rentRows = [
    { key: "rentResidential", label: "مسکونی", icon: icons.house,  bg: "rgba(78,205,196,0.12)" },
    { key: "rentOffice",      label: "اداری",  icon: icons.office, bg: "rgba(255,255,255,0.06)" },
    { key: "rentCommercial",  label: "تجاری",  icon: icons.shop,   bg: "rgba(255,255,255,0.06)" },
  ];

  let html = `
  <div class="d-section">
    <div class="d-section-title">
      <div class="title-icon">${icons.house}</div>
      قیمت خرید · تومان / متر
    </div>
    <div class="d-list">`;

  buyRows.forEach(row => {
    html += `
    <div class="d-row">
      <div class="d-row-left">
        ${iconBox(row.icon, row.bg)}
        <span class="d-row-label">${row.label}</span>
      </div>
      <div class="d-row-right">
        <div class="d-row-value" style="color:var(--gold2)">${fmt(row.val)}</div>
        <div class="d-row-sub">تومان / متر</div>
      </div>
    </div>`;
  });

  html += `</div></div>

  <div class="d-section">
    <div class="d-section-title">
      <div class="title-icon">${icons.key}</div>
      رهن و اجاره · تومان / متر
    </div>
    <div class="d-list">`;

  rentRows.forEach(row => {
    const monthly = calcRent(r[row.key], r.luxury);
    html += `
    <div class="rent-block">
      <div class="rent-main">
        <div class="d-row-left">
          ${iconBox(row.icon, row.bg)}
          <span class="d-row-label">${row.label}</span>
        </div>
        <div class="d-row-right">
          <div class="d-row-value" style="color:var(--teal)">${fmt(r[row.key])}</div>
          <div class="d-row-sub">تومان / متر</div>
        </div>
      </div>
      ${monthly > 0 ? `
      <div class="rent-sub-bar">
        <span class="rent-sub-label">← اجاره ماهانه</span>
        <span class="rent-sub-value">${fmt(monthly)} تومان</span>
      </div>` : ''}
    </div>`;
  });

  html += `</div>
  <div style="font-size:10px;color:var(--white20);text-align:center;margin-top:8px">
    هر ۱ میلیون رهن = ${(rate/1000).toFixed(0)} هزار تومان اجاره${r.luxury ? ' (نرخ لوکس)' : ''}
  </div>
  </div>

  <div class="calc-wrap">
    <div class="calc-label">${icons.calc} ماشین حساب رهن</div>
    <input class="calc-field" type="number" id="calcInput"
      placeholder="مبلغ رهن را وارد کن (تومان)" oninput="doCalc(${rate})">
    <div class="calc-output" id="calcOut"></div>
    <div class="calc-note">مثال: ۵۰۰۰۰۰۰۰ = پنجاه میلیون تومان</div>
  </div>`;

  document.getElementById("sheetBody").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("sheet").classList.add("open");
  document.body.style.overflow = "hidden";
}

function doCalc(rate) {
  const v = parseInt(document.getElementById("calcInput").value);
  const out = document.getElementById("calcOut");
  if (!v || isNaN(v)) { out.textContent = ""; return; }
  out.textContent = "اجاره ماهانه: " + fmt(Math.round((v/1e6)*rate)) + " تومان";
}

function closeSheet() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  currentFilter = t.dataset.filter;
  if (appData) render();
});

let startY = 0;
document.getElementById("sheet").addEventListener("touchstart", e => startY = e.touches[0].clientY, {passive:true});
document.getElementById("sheet").addEventListener("touchend", e => { if (e.changedTouches[0].clientY - startY > 80) closeSheet(); }, {passive:true});

loadData();
</script>
</body>
</html>

echo "done"
